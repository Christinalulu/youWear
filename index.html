<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="shortcut icon"
      href="assets/icons/favicon-logo.svg"
      type="image/x-icon"
    />

    <title>YouWear</title>
  </head>

  <body>
    <header class="main-header">
      <div class="logo">
        <h1 class="inner-logo">YouWear</h1>
      </div>

      <nav class="main-nav">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="cart.html">Cart</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="hero-content">
          <h2>Discover Your Style</h2>
          <p>Find fashion that fits your style.</p>

          <a href="shop.html" class="shop-button">Shop now</a>
        </div>
      </section>

      <section class="featured-products">
        <h2>Featured Products</h2>

        <div class="products-container"></div>
        <div class="view-all-container">
          <a href="shop.html" class="view-all-button"> View All Products → </a>
        </div>
      </section>

      <section class="categories">
        <h2>Shop by Category</h2>

        <div class="category-container">
          <button>Women's Clothing</button>
          <button>Men's Clothing</button>
          <button>Shoes</button>
          <button>Accessories</button>
        </div>
      </section>

      <section class="newsletter">
        <h2>Stay Updated</h2>
        <p>Subscribe to get updates on new products and offers.</p>

        <form>
          <input type="email" placeholder="Enter your email" />
          <button type="submit">Subscribe</button>
        </form>
      </section>

      <footer class="main-footer">
        <div class="footer-content">
          <h2>YouWear</h2>
          <p>Your Style, Your Way.</p>
        </div>

        <p class="copyright">© 2026 YouWear. All rights reserved.</p>
      </footer>
    </main>

    <script src="js/home.js"></script>
  </body>
</html>
